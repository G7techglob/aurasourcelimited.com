
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Aura Source | Administrator Login</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="login-container">
    <h1 class="brand">AURA <span>SOURCE</span></h1>
    <p class="subtitle">Administrator access</p>

    <form id="loginForm">
      <label for="email">Administrator email</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">SIGN IN</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <a class="return-link" href="index.html">
      ← Return to Aura Source website
    </a>

    <p class="security-note">
      Authorized administrators only. Your account is verified through Supabase.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
