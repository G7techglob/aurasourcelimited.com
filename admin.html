<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Aura Source Limited</title>

  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #11110f;
      --cream: #f5f1e8;
      --gold: #b49a68;
      --muted: #777269;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cream);
      color: var(--black);
      font-family: "Inter", sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 42px 32px;
      background: var(--white);
      border: 1px solid rgba(17, 17, 15, 0.1);
      box-shadow: 0 20px 60px rgba(17, 17, 15, 0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: 42px;
      letter-spacing: 5px;
      line-height: 1;
    }

    .brand span {
      display: block;
      margin-top: 8px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 7px;
    }

    .brand p {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 12px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd8ce;
      background: #fff;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(180, 154, 104, 0.15);
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      background: var(--black);
      color: var(--white);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:hover {
      background: #302d25;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      min-height: 20px;
      margin-top: 16px;
      color: #9b3028;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
    }

    .back-link:hover {
      color: var(--gold);
    }

    .notice {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #eee9df;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 35px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <header class="brand">
      <h1>AURA</h1>
      <span>SOURCE</span>
      <p>Administrator access</p>
    </header>

    <form id="loginForm">
      <label for="email">Administrator email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        placeholder="Enter your admin email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button id="loginButton" type="submit">
        SIGN IN
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="index.html">
      ← Return to Aura Source website
    </a>

    <p class="notice">
      Authorized administrators only. Your account will be verified
      securely through Supabase.
    </p>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://xmojdravrfrztusukjpg.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5qOMDwlNKI2E9F8vKSLT2Q_VdCyyWBE";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginForm = document.getElementById("loginForm");
  const loginButton = document.getElementById("loginButton");
  const message = document.getElementById("message");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    message.textContent = "";
    loginButton.disabled = true;
    loginButton.textContent = "SIGNING IN...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw error;
      }

      if (data.session) {
        message.style.color = "#267344";
        message.textContent = "Login successful. Your session is active.";
      }
    } catch (error) {
      message.style.color = "#9b3028";
      message.textContent =
        error.message || "Unable to sign in. Please try again.";
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "SIGN IN";
    }
  });
</script>

</body>
</html>
```
