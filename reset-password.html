
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | Aura Source Limited</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f8f4eb;
      font-family: Arial, sans-serif;
      color: #171717;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border: 1px solid #d4b36a;
      border-radius: 12px;
      box-shadow: 0 8px 30px #00000012;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-top: 0;
    }

    p {
      line-height: 1.5;
      color: #555;
    }

    label {
      display: block;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 6px;
      background: #171717;
      color: #d4b36a;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    a { color: #765819; }
  </style>
</head>
<body>
  <main class="card">
    <h1>AURA SOURCE</h1>
    <h2>Reset your password</h2>
    <p>Enter a new password for your administrator account.</p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8"
             autocomplete="new-password" required>

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8"
             autocomplete="new-password" required>

      <button id="resetButton" type="submit">SAVE NEW PASSWORD</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="admin.html">Return to administrator login</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://xmojdravrfrztusukjpg.supabase.co";

    // Use the same publishable key already used in admin.html.
    const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");

    async function prepareReset() {
      const hash = window.location.hash;
      const params = new URLSearchParams(hash.replace(/^#/, ""));
      const errorDescription = params.get("error_description");
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const type = params.get("type");

      if (errorDescription) {
        message.style.color = "#9b3028";
        message.textContent =
          "The reset link could not be used: " +
          errorDescription.replace(/\+/g, " ");
        return;
      }

      if (type === "recovery" && accessToken && refreshToken) {
        const { error } = await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (error) {
          message.style.color = "#9b3028";
          message.textContent =
            "This reset link has expired or is invalid. Request a new one.";
          return;
        }

        message.style.color = "#267344";
        message.textContent =
          "Reset link verified. Enter your new password below.";
        return;
      }

      const { data } = await client.auth.getSession();

      if (data.session) {
        message.style.color = "#267344";
        message.textContent =
          "A session is available. You may try setting a new password.";
      } else {
        message.style.color = "#9b3028";
        message.textContent =
          "Open this page using the newest password-reset link from your email. If the link opens the website homepage, request a new reset email after saving this page.";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.style.color = "#9b3028";
        message.textContent = "Use at least 8 characters.";
        return;
      }

      if (password !== confirmPassword) {
        message.style.color = "#9b3028";
        message.textContent = "The passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "SAVING...";

      try {
        const { data } = await client.auth.getSession();

        if (!data.session) {
          throw new Error(
            "Your reset link is missing or expired. Request a new password-reset email."
          );
        }

        const { error } = await client.auth.updateUser({ password });

        if (error) throw error;

        message.style.color = "#267344";
        message.textContent =
          "Password changed successfully. Return to the admin login and sign in with your new password.";
        form.reset();
      } catch (error) {
        message.style.color = "#9b3028";
        message.textContent = error.message ||
          "Could not reset your password. Please request a new link.";
      } finally {
        button.disabled = false;
        button.textContent = "SAVE NEW PASSWORD";
      }
    });

    prepareReset();
  </script>
</body>
</html>
