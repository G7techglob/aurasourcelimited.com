
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Aura Source | Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header>
    <h1>AURA <span>SOURCE</span> | ADMIN</h1>
    <button id="logoutButton" type="button">Sign out</button>
  </header>

  <main>
    <section class="welcome">
      <h2>Administrator Dashboard</h2>
      <p>Manage your Aura Source Limited product catalogue.</p>
      <p id="accountStatus" class="status">
        Checking administrator session...
      </p>
    </section>

    <section class="panel">
      <h2>Product catalogue</h2>
      <p class="notice">
        View published products stored in Supabase.
      </p>
      <p id="message" role="status" aria-live="polite" class="status">
        Loading products...
      </p>
      <div id="productList" class="product-list"></div>
    </section>

    <a class="link-button" href="index.html">
      Return to website
    </a>
  </main>

  <footer>Aura Source Limited · Administrator access</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dashboard.js"></script>
</body>
</html>
